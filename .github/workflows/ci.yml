name: CI - Frontend & Backend

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    name: Backend - Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install backend deps
        run: |
          cd backend
          npm ci

      - name: Backend - Lint (if configured)
        run: |
          cd backend
          if grep -q '"lint"' package.json; then
            npm run -s lint
          else
            echo "No backend lint script; skipping"
          fi

      - name: Backend - Run tests
        run: |
          cd backend
          # If package defines test script, prefer it; otherwise run the repo's run-tests.js
          if grep -q '"test"' package.json; then
            npm test -- --coverage || exit 1
          elif [ -f run-tests.js ]; then
            node run-tests.js
          else
            echo "No tests found for backend"; exit 1
          fi

      - name: Upload backend coverage (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage || ''

  frontend-tests:
    name: Frontend - Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Frontend - Lint (if configured)
        run: |
          cd frontend
          if grep -q '"lint"' package.json; then
            npm run -s lint
          else
            echo "No frontend lint script; skipping"
          fi

      - name: Frontend - Build
        run: |
          cd frontend
          npm run build

      - name: Frontend - Run tests (if configured)
        run: |
          cd frontend
          if grep -q '"test"' package.json; then
            npm test -- --coverage || exit 1
          else
            echo "No frontend test script; skipping"
          fi

  accessibility:
    name: Accessibility Checks (frontend)
    runs-on: ubuntu-latest
    needs: frontend-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run frontend accessibility (if configured)
        run: |
          if [ -d frontend ]; then
            cd frontend
            npm ci
            if grep -q '"accessibility"' package.json; then
              npm run -s accessibility
            else
              echo "No accessibility script defined in frontend/package.json; skipping"
            fi
          else
            echo "No frontend directory present; skipping accessibility checks"
          fi

  audit-report:
    name: Audit & Report
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, accessibility]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Save summary
        run: |
          echo "Constitution gates summary:" > ci-constitution-summary.txt
          echo "- Backend checks: completed" >> ci-constitution-summary.txt
          echo "- Frontend checks: completed" >> ci-constitution-summary.txt
          echo "- Accessibility: completed (or skipped if not configured)" >> ci-constitution-summary.txt

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: ci-constitution-summary
          path: ci-constitution-summary.txt
